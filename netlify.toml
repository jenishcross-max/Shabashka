[build]
  base = "frontend"
  publish = "dist"
  command = "npm install && npm run build"

# robots.txt и sitemap.xml генерируются бэкендом (там же, где данные заказов) —
# проксируем эти два пути на Render, иначе поисковики видят вместо них SPA-страницу.
[[redirects]]
  from = "/robots.txt"
  to = "https://shabashka-zvkc.onrender.com/robots.txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "https://shabashka-zvkc.onrender.com/sitemap.xml"
  status = 200

# Короткая ссылка на подписку в боте из постов Threads (см.
# backend/src/social/subLine.js): шабашка.com/s/obshchepit → бэкенд считает
# переход и отправляет в бота. Должно стоять выше SPA-правила.
[[redirects]]
  from = "/s/:slug"
  to = "https://shabashka-zvkc.onrender.com/api/subscribe/:slug/threads"
  status = 302

# То же с источником: шабашка.com/s/obshchepit/telegram — кнопка под вакансией в
# Telegram-группе (см. backend/src/telegram/subscriptions.js). Бэкенд считает
# переход по источнику, незнакомый пишет в «без метки».
[[redirects]]
  from = "/s/:slug/:from"
  to = "https://shabashka-zvkc.onrender.com/api/subscribe/:slug/:from"
  status = 302

# Кнопка «💬 Написать» в подборке бота (см. backend/src/routes/contact.js):
# шабашка.com/c/12/digest → бэкенд считает отклик и ведёт в WhatsApp работодателя.
[[redirects]]
  from = "/c/:id/:from"
  to = "https://shabashka-zvkc.onrender.com/api/contact/vacancy/:id/:from"
  status = 302

# Ссылка в Telegram-группу из постов Threads (см. backend/src/social/subLine.js):
# бэкенд считает переход и ведёт в группу — рядом с переходами в бота по /s/.
[[redirects]]
  from = "/g"
  to = "https://shabashka-zvkc.onrender.com/api/go/group/threads"
  status = 302

# WhatsApp-канал (см. backend/src/routes/go.js): шабашка.com/w — из постов Threads,
# шабашка.com/w/<откуда> — с сайта, из шапки Instagram и Threads, из группы.
# Бэкенд считает переход и ведёт в канал.
[[redirects]]
  from = "/w"
  to = "https://shabashka-zvkc.onrender.com/api/go/whatsapp/threads"
  status = 302

[[redirects]]
  from = "/w/:from"
  to = "https://shabashka-zvkc.onrender.com/api/go/whatsapp/:from"
  status = 302

# SPA-роутинг: любой путь отдаём index.html, React Router разбирается сам.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
