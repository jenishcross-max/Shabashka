[build]
  base = "frontend"
  publish = "dist"
  command = "npm install && npm run build"

# robots.txt и sitemap.xml генерируются бэкендом (там же, где данные заказов) —
# проксируем эти два пути на Render, иначе поисковики видят вместо них SPA-страницу.
[[redirects]]
  from = "/robots.txt"
  to = "https://shabashka-zvkc.onrender.com/robots.txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "https://shabashka-zvkc.onrender.com/sitemap.xml"
  status = 200

# Короткая ссылка на подписку в боте из постов Threads (см.
# backend/src/social/subLine.js): шабашка.com/s/obshchepit → бэкенд считает
# переход и отправляет в бота. Должно стоять выше SPA-правила.
[[redirects]]
  from = "/s/:slug"
  to = "https://shabashka-zvkc.onrender.com/api/subscribe/:slug/threads"
  status = 302

# SPA-роутинг: любой путь отдаём index.html, React Router разбирается сам.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
