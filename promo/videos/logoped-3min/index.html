      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0e1417;
      }
      /* Цвета самого тренажёра: фон #0e1417, карточки #182428, бирюза #44c3a4 */
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Golos Text', sans-serif;
        color: #fff;
        background: radial-gradient(120% 70% at 50% 30%, #17262a 0%, #0e1417 70%);
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .teal {
        color: #44c3a4;
      }
      /* 1. Крючок: виден с первого кадра */
      .hook {
        position: absolute;
        left: 80px;
        right: 80px;
        top: 420px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .pill {
        font-family: 'Rubik', sans-serif;
        font-weight: 800;
        font-size: 44px;
        letter-spacing: 0.04em;
        background: #44c3a4;
        color: #0e1417;
        padding: 10px 34px 14px;
        border-radius: 999px;
        margin-bottom: 44px;
      }
      .h-xl {
        font-family: 'Rubik', sans-serif;
        font-weight: 900;
        font-size: 100px;
        line-height: 1.04;
        letter-spacing: -0.03em;
      }
      .word {
        display: block;
      }
      .shake {
        display: inline-block;
      }
      .clock {
        position: absolute;
        left: 0;
        right: 0;
        top: 1180px;
        text-align: center;
        font-family: 'Rubik', sans-serif;
        font-weight: 900;
        font-size: 300px;
        line-height: 1;
        color: #44c3a4;
        letter-spacing: -0.03em;
      }
      .clock-sub {
        position: absolute;
        left: 0;
        right: 0;
        top: 1500px;
        text-align: center;
        font-size: 46px;
        font-weight: 600;
        color: #a9c3be;
      }
      /* 2. Телефон с настоящими экранами */
      .cap {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 150px;
        height: 170px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: 'Rubik', sans-serif;
        font-weight: 800;
        font-size: 66px;
        line-height: 1.08;
      }
      .cap .n {
        display: inline-block;
        background: #44c3a4;
        color: #0e1417;
        border-radius: 22px;
        padding: 0 22px 6px;
        margin-right: 18px;
      }
      .phone {
        position: absolute;
        left: 170px;
        top: 350px;
        width: 740px;
        height: 1500px;
        border-radius: 70px;
        background: #05080a;
        padding: 20px;
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.55), 0 0 0 3px #2a3a3e;
      }
      .screen {
        position: relative;
        width: 700px;
        height: 1460px;
        border-radius: 52px;
        overflow: hidden;
        background: #0e1417;
      }
      .screen .hdr {
        position: absolute;
        left: 0;
        top: 30px;
        width: 700px;
      }
      .screen .shot {
        position: absolute;
        left: 0;
        top: 206px;
        width: 700px;
      }
      /* 3. Финал */
      .fin {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 70px 160px;
      }
      .orb {
        width: 220px;

        border-radius: 50%;

      .f-name {

        font-weight: 600;
        color: #7f9a95;
      }

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1080" data-height="1920" data-fps="30">
      <!-- 1. Крючок -->
      <section id="s1" class="scene clip" data-start="0" data-duration="1.8" data-track-index="0">
        <div class="hook">
          <div class="h-xl">
            <span class="word">Собеседование</span>

      <section id="s2" class="scene clip" data-start="1.8" data-duration="11.4" data-track-index="0">

        <div id="cap2" class="cap"><span><span class="n">2</span>Подышать</span></div>

      <audio id="sfx-1" src="assets/sfx/pop.mp3" data-start="0.50" data-duration="0.72" data-volume="0.45" data-track-index="11"></audio>
      <audio id="sfx-2" src="assets/sfx/whoosh-short.mp3" data-start="1.75" data-duration="0.57" data-volume="0.4" data-track-index="12"></audio>
      <audio id="sfx-3" src="assets/sfx/click-soft.mp3" data-start="1.85" data-duration="0.37" data-volume="0.45" data-track-index="13"></audio>
      <audio id="sfx-4" src="assets/sfx/click-soft.mp3" data-start="3.85" data-duration="0.37" data-volume="0.45" data-track-index="13"></audio>
      <audio id="sfx-5" src="assets/sfx/click-soft.mp3" data-start="5.85" data-duration="0.37" data-volume="0.45" data-track-index="13"></audio>
      <audio id="sfx-6" src="assets/sfx/click-soft.mp3" data-start="7.85" data-duration="0.37" data-volume="0.45" data-track-index="13"></audio>
      <audio id="sfx-7" src="assets/sfx/click-soft.mp3" data-start="9.85" data-duration="0.37" data-volume="0.45" data-track-index="13"></audio>
      <audio id="sfx-8" src="assets/sfx/whoosh-short.mp3" data-start="13.15" data-duration="0.57" data-volume="0.4" data-track-index="12"></audio>
      <audio id="sfx-9" src="assets/sfx/chime.mp3" data-start="14.30" data-duration="2.5" data-volume="0.4" data-track-index="14"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 1. Крючок: «дрожит» дрожит, часы появляются
      tl.fromTo('#s1-shake', { x: 0 }, { x: 10, duration: 0.05, repeat: 15, yoyo: true, ease: 'none' }, 0.15);
      tl.fromTo('#s1-clock', { scale: 1 }, { scale: 1.06, duration: 0.3, yoyo: true, repeat: 1, ease: 'power2.out' }, 0.5);
      tl.fromTo('#s1-sub', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 0.9);

      // 2. Телефон въезжает, экраны и подписи сменяются
      tl.fromTo('#phone', { y: 500, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: 'power3.out' }, 1.8);
      const T = [1.8, 3.8, 5.8, 7.8, 9.8, 11.5];
      const caps = ['#cap1', '#cap2', '#cap3', '#cap4', '#cap5', '#cap5'];
      for (let i = 0; i < 6; i++) {
        const t = T[i], end = i < 5 ? T[i + 1] : 13.2;
        tl.set('#sh' + (i + 1), { opacity: 0 }, 0);
        tl.fromTo('#sh' + (i + 1), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, t + 0.05);
        if (i < 5) tl.to('#sh' + (i + 1), { opacity: 0, duration: 0.2 }, end - 0.05);
      }
      tl.set('#hdr2', { opacity: 0 }, 0);
      tl.set('#hdr1', { opacity: 0 }, 9.8);
      tl.set('#hdr2', { opacity: 1 }, 9.8);
      ['#cap1', '#cap2', '#cap3', '#cap4', '#cap5'].forEach((c, i) => {
        tl.set(c, { opacity: 0 }, 0);
        tl.fromTo(c, { opacity: 0, y: 30, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: 'back.out(1.8)' }, T[i] + 0.05);
        if (i < 4) tl.to(c, { opacity: 0, duration: 0.15 }, T[i + 1] - 0.05);
      });

      // 3. Финал
      tl.fromTo('#f-orb', { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(1.6)' }, 13.25);
      tl.to('#f-orb', { scale: 1.12, duration: 2, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 13.8);
      tl.fromTo('#f-name', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 13.4);
      tl.fromTo('#f-line', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 13.8);
      tl.fromTo('#f-free', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(2)' }, 14.3);
      tl.fromTo('#f-url', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 14.7);
      tl.fromTo('#f-handle', { opacity: 0 }, { opacity: 1, duration: 0.4 }, 15.1);

      window.__timelines['main'] = tl;
    </script>
