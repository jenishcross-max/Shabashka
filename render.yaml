services:
  - type: web
    name: shabashka-kg
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20
    disk:
      name: shabashka-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
