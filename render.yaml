services:
  - type: web
    name: shabashka-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
