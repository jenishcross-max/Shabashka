services:
  - type: web
    name: shabashka-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      # Импорт объявлений через Telegram-бота (см. README). Без этих переменных
      # бот просто не запускается, остальной сайт работает как раньше.
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
